openapi: 3.1.0
info:
  title: NeuroMZ protocol
  version: 1.0.0
  summary: Host NeuroMZ models, train them as jobs, run inference and traces over HTTP.
  description: |
    The machine-readable contract of the NeuroMZ protocol; PROTOCOL.md is the
    human-readable one and wins where the two differ. All bodies are JSON
    unless stated otherwise; every error has the `Error` shape.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8470
    description: the reference server's default address
security:
  - bearer: []
tags:
  - name: server
  - name: models
  - name: datasets
  - name: jobs
  - name: inference

paths:
  /v1/health:
    get:
      tags: [server]
      summary: Liveness (no authentication)
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}

  /v1/server:
    get:
      tags: [server]
      summary: Server, protocol and library versions, and the caller
      responses:
        "200":
          description: Server information.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServerInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/capabilities:
    get:
      tags: [server]
      summary: Backends, devices, memory, presets, limits and save policy
      responses:
        "200":
          description: What the server offers.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Capabilities"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/models:
    get:
      tags: [models]
      summary: List models
      responses:
        "200":
          description: All models (summaries).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Model"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [models]
      summary: Create a model from a preset or layer specs (the program's `new`)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ModelCreate"}
      responses:
        "201":
          description: Created, with the explanation of every choice.
          content:
            application/json:
              schema:
                type: object
                required: [model, explanation]
                properties:
                  model: {$ref: "#/components/schemas/Model"}
                  explanation:
                    type: array
                    items: {type: string}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "507": {$ref: "#/components/responses/Error"}

  /v1/models/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      tags: [models]
      summary: Describe a model
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Model"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [models]
      summary: Delete a model
      responses:
        "204": {description: Deleted.}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}

  /v1/models/{name}/file:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      tags: [models]
      summary: Download the model file (.nmz)
      responses:
        "200":
          description: The file, the same on every device.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [models]
      summary: Upload a model file (.nmz)
      parameters:
        - $ref: "#/components/parameters/Save"
        - $ref: "#/components/parameters/Overwrite"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Model"}
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Model"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}

  /v1/models/{name}/predict:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      tags: [inference]
      summary: Outputs for samples, a dataset sample, or the next character of a text
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PredictRequest"}
      responses:
        "200":
          description: Outputs.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PredictResponse"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}

  /v1/models/{name}/test:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      tags: [inference]
      summary: Loss, accuracy and confusion matrix on a dataset
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TestRequest"}
      responses:
        "200":
          description: Results.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TestResponse"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}

  /v1/models/{name}/generate:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      tags: [inference]
      summary: Sample text from a text model
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GenerateRequest"}
      responses:
        "200":
          description: Generated items or passages.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenerateResponse"}
        "422": {$ref: "#/components/responses/Error"}

  /v1/models/{name}/trace:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      tags: [inference]
      summary: One forward and backward pass with every number (JSON lines)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TraceRequest"}
      responses:
        "200":
          description: One trace event per line (the library's nmz_trace_event_write_json).
          headers:
            X-Trace-Events: {schema: {type: integer}}
            X-Trace-Truncated: {schema: {type: integer, enum: [0, 1]}}
          content:
            application/x-ndjson:
              schema: {$ref: "#/components/schemas/TraceEvent"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}

  /v1/datasets:
    get:
      tags: [datasets]
      summary: List datasets
      responses:
        "200":
          description: All datasets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Dataset"}
    post:
      tags: [datasets]
      summary: Register a file that is on the server (under an allowed root)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DatasetRegister"}
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dataset"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}

  /v1/datasets/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      tags: [datasets]
      summary: Describe a dataset
      responses:
        "200":
          description: The dataset.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dataset"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [datasets]
      summary: Upload a dataset file (CSV, text, IDX)
      parameters:
        - name: format
          in: query
          required: true
          schema: {type: string, enum: [csv, text, idx-images, idx-labels]}
        - name: labels
          in: query
          schema: {type: string}
        - $ref: "#/components/parameters/Overwrite"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, contentMediaType: application/octet-stream}
          text/plain:
            schema: {type: string}
          text/csv:
            schema: {type: string}
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dataset"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "507": {$ref: "#/components/responses/Error"}
    delete:
      tags: [datasets]
      summary: Delete a dataset
      responses:
        "204": {description: Deleted.}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}

  /v1/jobs:
    get:
      tags: [jobs]
      summary: List jobs
      parameters:
        - name: state
          in: query
          schema: {$ref: "#/components/schemas/JobState"}
      responses:
        "200":
          description: Jobs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Job"}
    post:
      tags: [jobs]
      summary: Start a training job
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JobCreate"}
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}

  /v1/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      summary: A job's state, progress and result
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "404": {$ref: "#/components/responses/Error"}

  /v1/jobs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [jobs]
      summary: Cancel a job (a running one stops after its current batch)
      responses:
        "202":
          description: Cancelled or stopping.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "409": {$ref: "#/components/responses/Error"}

  /v1/jobs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      summary: Progress as Server-Sent Events (state, epoch, batch, end)
      security:
        - bearer: []
        - query: []
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: string}
      responses:
        "200":
          description: An event stream; `end` is the last event.
          content:
            text/event-stream:
              schema: {type: string}

  /v1/jobs/{id}/model:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      summary: The trained model file of a job
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        "404": {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    query:
      type: apiKey
      in: query
      name: access_token
      description: For GET requests from browsers (EventSource cannot set headers).

  parameters:
    Name:
      name: name
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
    JobId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: "^j[0-9]+$"}
    Save:
      name: save
      in: query
      schema: {$ref: "#/components/schemas/Save"}
    Overwrite:
      name: overwrite
      in: query
      schema: {type: boolean, default: false}

  responses:
    Error:
      description: An error (see PROTOCOL.md §3 for the codes).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: No token, or an unknown one.
      headers:
        WWW-Authenticate: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Name:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
      description: Not ending in '.', not a Windows device name.
    Save:
      type: string
      enum: [server, client]
    Device:
      type: string
      enum: [auto, cpu, cuda]
    Time:
      type: string
      format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, invalid_name, unauthorized, forbidden, save_not_allowed, not_found,
                     method_not_allowed, request_timeout, conflict, length_required, payload_too_large,
                     unsupported_media_type, invalid_argument, queue_full, headers_too_large, internal,
                     unavailable, http_version_not_supported, quota_exceeded, out_of_memory, numeric]
            message: {type: string}
            details: {type: object}
    Health:
      type: object
      required: [status, protocol]
      properties:
        status: {type: string, const: ok}
        protocol: {type: string}
    ServerInfo:
      type: object
      required: [name, version, protocol, library, started, uptime_s, user]
      properties:
        name: {type: string}
        version: {type: string}
        protocol: {type: string}
        library: {type: string}
        started: {$ref: "#/components/schemas/Time"}
        uptime_s: {type: number}
        user:
          type: object
          required: [name, permissions]
          properties:
            name: {type: string}
            permissions:
              type: array
              items: {type: string, enum: [read, train, admin]}
    Backend:
      type: object
      required: [name, available]
      properties:
        name: {type: string}
        available: {type: boolean}
        reason: {type: string}
        device: {type: string}
        threads: {type: integer}
        compute_capability: {type: string}
        memory_total_mb: {type: number}
        memory_free_mb: {type: number}
        memory_limit_mb: {type: number}
        memory_used_mb: {type: number}
    Capabilities:
      type: object
      required: [protocol, auth, backends, default_device, presets, save, limits, trace, dataset_formats, features]
      properties:
        protocol: {type: string}
        auth: {type: boolean}
        backends:
          type: array
          items: {$ref: "#/components/schemas/Backend"}
        default_device: {type: string}
        presets:
          type: array
          items:
            type: object
            required: [name, summary, input]
            properties:
              name: {type: string}
              summary: {type: string}
              input: {type: string}
        save:
          type: object
          required: [default, allowed]
          properties:
            default: {$ref: "#/components/schemas/Save"}
            allowed:
              type: array
              items: {$ref: "#/components/schemas/Save"}
        limits:
          type: object
          properties:
            max_upload_mb: {type: number}
            max_model_mb: {type: number}
            max_epochs: {type: integer}
            max_concurrent_jobs: {type: integer}
            queue_size: {type: integer}
            quota_per_user_mb: {type: number}
            client_model_hours: {type: number}
            keep_finished_hours: {type: number}
        trace:
          type: object
          properties:
            enabled: {type: boolean}
            max_events: {type: integer}
        dataset_formats:
          type: array
          items: {type: string}
        features:
          type: array
          items: {type: string}
    Layer:
      type: object
      required: [index, type, description, params]
      properties:
        index: {type: integer}
        type: {type: string}
        description: {type: string}
        params: {type: integer}
    Model:
      type: object
      required: [name, owner, storage, version, created, updated, size, params, sequence, input_shape, outputs]
      properties:
        name: {$ref: "#/components/schemas/Name"}
        owner: {type: string}
        storage: {$ref: "#/components/schemas/Save"}
        version: {type: integer}
        created: {$ref: "#/components/schemas/Time"}
        updated: {$ref: "#/components/schemas/Time"}
        expires: {oneOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
        size: {type: integer}
        params: {type: integer}
        sequence: {type: boolean}
        input_shape:
          type: array
          items: {type: integer}
        outputs: {type: integer}
        loss: {type: string}
        normalization: {type: string}
        vocab_size: {type: [integer, "null"]}
        train_steps: {type: integer}
        layers:
          type: array
          items: {$ref: "#/components/schemas/Layer"}
        config:
          type: object
          properties:
            summary: {type: string}
    TrainOptions:
      type: object
      description: The program's training options, `--k` for key `k` (`_` written as `-`).
      properties:
        lr: {type: number}
        momentum: {type: number}
        batch: {type: integer}
        epochs: {type: integer}
        target_loss: {type: number}
        optimizer: {type: string, enum: [sgd, adam, adamw]}
        beta1: {type: number}
        beta2: {type: number}
        eps: {type: number}
        schedule: {type: string, enum: [constant, step, cosine, warmup-cosine]}
        step_size: {type: integer}
        gamma: {type: number}
        min_lr: {type: number}
        weight_decay: {type: number}
        decay_all: {type: boolean}
        warmup: {type: integer}
        shuffle: {type: boolean}
        carry: {type: boolean}
        val: {type: number}
        clip: {type: number}
        patience: {type: integer}
        seq_len: {type: integer}
    ModelCreate:
      type: object
      required: [name]
      properties:
        name: {$ref: "#/components/schemas/Name"}
        args:
          type: array
          items: {type: string}
          description: The arguments of `neuromz new` (instead of the fields below).
        preset: {type: string}
        input: {type: string}
        layers:
          type: array
          items: {type: string}
        dataset: {$ref: "#/components/schemas/Name"}
        loss: {type: string}
        normalize: {type: string}
        seed: {type: integer}
        items: {type: boolean}
        strip_diacritics: {type: boolean}
        unify_alef: {type: boolean}
        options: {$ref: "#/components/schemas/TrainOptions"}
        save: {$ref: "#/components/schemas/Save"}
        overwrite: {type: boolean, default: false}
    Dataset:
      type: object
      required: [name, owner, format, size, sha256, created, source]
      properties:
        name: {$ref: "#/components/schemas/Name"}
        owner: {type: string}
        format: {type: string, enum: [csv, text, idx-images, idx-labels]}
        size: {type: integer}
        sha256: {type: string}
        created: {$ref: "#/components/schemas/Time"}
        source: {type: string, enum: [upload, path]}
        labels: {type: [string, "null"]}
    DatasetRegister:
      type: object
      required: [name, path, format]
      properties:
        name: {$ref: "#/components/schemas/Name"}
        path: {type: string}
        format: {type: string, enum: [csv, text, idx-images, idx-labels]}
        labels: {type: string}
        overwrite: {type: boolean}
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    JobCreate:
      type: object
      required: [type, model, dataset]
      properties:
        type: {type: string, const: train}
        model: {$ref: "#/components/schemas/Name"}
        dataset: {$ref: "#/components/schemas/Name"}
        validation: {$ref: "#/components/schemas/Name"}
        device: {$ref: "#/components/schemas/Device"}
        save: {$ref: "#/components/schemas/Save"}
        options: {$ref: "#/components/schemas/TrainOptions"}
        args:
          type: array
          items: {type: string}
        limit: {type: integer, minimum: 0}
        header: {type: [boolean, "null"]}
    Progress:
      type: object
      properties:
        epoch: {type: integer}
        epochs: {type: integer}
        batch: {type: integer}
        batches: {type: integer}
        loss: {type: [number, "null"]}
        accuracy: {type: [number, "null"]}
        val_loss: {type: [number, "null"]}
        val_accuracy: {type: [number, "null"]}
        learning_rate: {type: number}
        elapsed_s: {type: number}
    Result:
      type: object
      properties:
        epochs: {type: integer}
        loss: {type: [number, "null"]}
        accuracy: {type: [number, "null"]}
        val_loss: {type: [number, "null"]}
        val_accuracy: {type: [number, "null"]}
        converged: {type: boolean}
        stopped: {type: boolean}
        best_epoch: {type: integer}
    Job:
      type: object
      required: [id, type, state, owner, model, dataset, device_requested, save, created]
      properties:
        id: {type: string}
        type: {type: string}
        state: {$ref: "#/components/schemas/JobState"}
        owner: {type: string}
        model: {type: string}
        dataset: {type: string}
        validation: {type: [string, "null"]}
        device_requested: {type: string}
        device: {type: [string, "null"]}
        save: {$ref: "#/components/schemas/Save"}
        created: {$ref: "#/components/schemas/Time"}
        started: {oneOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
        finished: {oneOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
        config: {type: [string, "null"]}
        progress: {oneOf: [{$ref: "#/components/schemas/Progress"}, {type: "null"}]}
        result: {oneOf: [{$ref: "#/components/schemas/Result"}, {type: "null"}]}
        error:
          oneOf:
            - type: "null"
            - type: object
              required: [code, message]
              properties:
                code: {type: string}
                message: {type: string}
        output_model: {type: [string, "null"]}
        gpu_memory_peak_mb: {type: [number, "null"]}
    PredictRequest:
      type: object
      properties:
        inputs:
          oneOf:
            - type: array
              items: {type: number}
            - type: array
              items:
                type: array
                items: {type: number}
        dataset: {$ref: "#/components/schemas/Name"}
        sample: {type: integer, minimum: 0}
        text: {type: string}
        device: {$ref: "#/components/schemas/Device"}
    PredictResponse:
      type: object
      properties:
        outputs:
          type: array
          items:
            type: array
            items: {type: [number, "null"]}
        predicted:
          type: array
          items: {type: integer}
        classes: {type: [array, "null"], items: {type: string}}
        targets: {type: [array, "null"]}
        text: {type: string}
        next:
          type: array
          items:
            type: object
            properties:
              char: {type: string}
              p: {type: number}
    TestRequest:
      type: object
      required: [dataset]
      properties:
        dataset: {$ref: "#/components/schemas/Name"}
        labels: {$ref: "#/components/schemas/Name"}
        limit: {type: integer, minimum: 0}
        header: {type: [boolean, "null"]}
        device: {$ref: "#/components/schemas/Device"}
    TestResponse:
      type: object
      required: [dataset, samples, loss]
      properties:
        dataset: {type: string}
        samples: {type: integer}
        loss: {type: [number, "null"]}
        accuracy: {type: [number, "null"]}
        perplexity: {type: [number, "null"]}
        classes: {type: [array, "null"], items: {type: string}}
        confusion:
          type: [array, "null"]
          items:
            type: array
            items: {type: integer}
    GenerateRequest:
      type: object
      properties:
        prime: {type: string}
        length: {type: integer, minimum: 1}
        temperature: {type: number, exclusiveMinimum: 0}
        top_k: {type: integer, minimum: 0}
        seed: {type: integer, minimum: 0}
        count: {type: integer, minimum: 1}
        new_only: {type: boolean}
        context: {type: integer, minimum: 1}
        no_cache: {type: boolean}
        dataset: {$ref: "#/components/schemas/Name"}
        device: {$ref: "#/components/schemas/Device"}
    GenerateResponse:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [items, text]}
        items:
          type: array
          items:
            type: object
            required: [text, known]
            properties:
              text: {type: string}
              known: {type: boolean}
        attempts: {type: integer}
        texts:
          type: array
          items: {type: string}
    TraceRequest:
      type: object
      properties:
        inputs:
          type: array
          items: {type: number}
        target:
          type: array
          items: {type: number}
        dataset: {$ref: "#/components/schemas/Name"}
        sample: {type: integer, minimum: 0}
        text: {type: string}
        device: {$ref: "#/components/schemas/Device"}
    TraceEvent:
      type: object
      required: [step, phase, layer, time_step, type, detail, scalars, items]
      properties:
        step: {type: integer}
        phase: {type: string}
        layer: {type: integer}
        time_step: {type: integer}
        type: {type: string}
        detail: {type: string}
        scalars:
          type: object
          additionalProperties: {type: [number, "null"]}
        items:
          type: object
          additionalProperties:
            type: object
            required: [shape, data]
            properties:
              shape:
                type: array
                items: {type: integer}
              data:
                type: array
                items: {type: [number, "null"]}
